# Teacher-student experiment: the student's first tool call is scored against the
# teacher's on paired traces.
#
# The pack (configs/packs/tools.yaml) supplies the tool_alignment signal,
# objective.primary, and the screening gate. Signals below are merged with the
# pack's by name; objective/screening keys below override the pack's.

schema_version: 1
mode: teacher_student
packs: [tools]

run:
  dir: run_ts
  max_metric_calls: 10
  eval_run_timeout_sec: 21600
  seed_candidate: data/seed_teacher_student.json
  # CORE_TOOLS expands to every core tool description, but reflection only
  # rewrites the ones appearing in the first-tool mismatch set.
  editable_modules: [CORE_TOOLS, RULES_EXT]

models:
  student: claude_sonnet
  teacher: claude_opus
  reflection: OPEN_AI:GPT5_LATEST

data:
  eval_set_name: Glean Chat V2 Medium
  deployment_ids: [scio-prod]
  # Pin both lists for a reproducible run, or omit them to auto-select.
  # train_eval_versions: [20260813, 20260820]
  # val_eval_versions: [20260827]
  #
  # lookback_days is the window size; days_back shifts the window's end date back
  # from today. Automatic selection otherwise follows the calendar, so it picks up
  # each newly published version and misses the eval-run cache. Setting days_back
  # holds the window still without hardcoding version numbers.
  lookback_days: 14
  days_back: 0
  val_version_count: 2

# Mode-owned Cortex judges; tool_alignment is merged in from the pack.
signals:
  - name: completeness
    source: cortex_judge
    type: COMPLETENESS
    kind: pointwise
    enabled: false
    run_params:
      llm_model: default
      use_cache: true

  - name: correctness
    source: cortex_judge
    type: CORRECTNESS
    kind: pairwise
    enabled: false
    run_params:
      judge_type: DIRECT_CORRECTNESS
      llm_model: default
      use_cache: true

objective:
  frontier_type: hybrid
  # tool_alignment carries the whole objective, so the score reads directly as the
  # first-tool match rate.
  #
  # The blend to use if the completeness judge is re-enabled:
  #   composite: {completeness: 0.5, tool_alignment: 0.5}
  composite:
    tool_alignment: 1.0
  # Enable the pairwise judge and uncomment to gate on correctness:
  # validation:
  #   - metric: correctness
  #     min: 0.95
  validation: []

search:
  offspring_count: 5
  # Set to `all` to reflect on every available example.
  reflection_samples: 8
  reflection_hamming_distance_k: null
  # Total prompt-token ceiling a mutated candidate may reach. Raised at startup to
  # fit the per-module budgets, so a value below those cannot starve a module.
  global_token_cap: 4096
