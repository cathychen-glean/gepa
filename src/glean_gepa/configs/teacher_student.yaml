# Teacher-student experiment with pairwise agentic preference as the primary.
#
# This file is self-contained. `signals`, `objective`, `screening`, and
# `reflection` below are the full experiment; nothing is merged in from elsewhere.
#
# Do not declare a same-named cortex_judge for agentic_preference_rate: the adapter
# unions AGENTIC_JUDGE from JUDGE_SPECS when this objective is selected. Screening
# reuses that judge on the teacher-preferred high-signal slice.

schema_version: 1
mode: teacher_student

run:
  dir: run_ts_agentic
  max_metric_calls: 10
  eval_run_timeout_sec: 21600
  seed_candidate: data/seed_candidate.json

models:
  student: claude_sonnet
  teacher: claude_opus
  reflection: CUSTOM:GPT5_6_LUNA

data:
  eval_set_name: Glean Chat V2 Medium
  deployment_ids: [scio-prod]
  lookback_days: 14
  days_back: 0
  val_version_count: 2

signals:
  - name: agentic_preference_rate
    source: agentic_preference
    lookback_days: 7

objective:
  primary: agentic_preference_rate
  frontier_type: objective
  composite:
    agentic_preference_rate: 1.0
  focused_bucket_type: QUERY_CANONICAL
  validation:
    - metric: agentic_preference_rate
      min: 0.50

screening:
  kind: high_signal_fix_rate
  threshold: 0.449
  high_signal: agentic_preference_rate

reflection:
  editable_modules: [RULES_EXT, EXECUTION_DISCIPLINE, CORE_TOOLS]
  failure_label: "REFLECTION EXAMPLES (teacher-preferred LOSS and student-preferred KEEP)"
  report_title: "REFLECTION: teacher vs student agentic preference"
  # Override module reflection prompts with modules.<KEY>.

search:
  offspring_count: 5
  reflection_samples: 25
  reflection_hamming_distance_k: null
  # Total prompt-token ceiling a mutated candidate may reach.
  global_token_cap: 4096
