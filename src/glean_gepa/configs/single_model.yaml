# Single-model experiment
#
# The pack (e.g. glean_gepa/configs/packs/shell.yaml) supplies the objective
# signal, objective.primary, its composite, and the screening gate. Signals declared
# below are merged with the pack's by name, and objective/screening keys set below
# override the pack's.

schema_version: 1
mode: single_model
packs: [shell] # or packs: [loops]

run:
  dir: run_sm # or dir: run_sm_loops
  max_metric_calls: 10
  eval_run_timeout_sec: 21600
  seed_candidate: data/seed_candidate.json

models:
  student: gpt
  reflection: OPEN_AI:GPT5_LATEST

data:
  eval_set_name: Glean Chat V2 Medium
  deployment_ids: [scio-prod]
  lookback_days: 14
  days_back: 0
  val_version_count: 2

objective:
  frontier_type: objective
  validation:
    - metric: correctness
      min: 0.80
    - metric: agentic_preference_rate
      min: 0.50

search:
  offspring_count: 5
  # Set to `all` to reflect on every available example.
  reflection_samples: 8
  reflection_hamming_distance_k: null
  # Total prompt-token ceiling a mutated candidate may reach. Raised at startup to
  # fit the per-module budgets, so a value below those cannot starve a module.
  global_token_cap: 4096
