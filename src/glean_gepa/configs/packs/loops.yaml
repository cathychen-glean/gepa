# Pack: fewer agent loops on a student-only eval.
# Scorable only by single_model mode (`packs: [loops]`).
# Source `loop_telemetry` is registered in objectives/registry.py.

signals:
  - name: loop_efficiency
    source: loop_telemetry
    lookback_days: 1

objective:
  primary: loop_efficiency
  composite:
    loop_efficiency: 1.0
  focused_bucket_type: QUERY_CANONICAL
  params:
    # Entries at or below this many loops score 1.0; each extra loop decays 1/(1+extra).
    target_loop_count: 2
    failure_score_below: 1.0

screening:
  kind: high_signal_fix_rate
  threshold: 0.333
  high_signal: loop_efficiency

reflection:
  editable_modules: [WRITING_CODE]
  failure_label: "HIGH-SIGNAL FAILURES (extra loops)"
  # Override module reflection prompts with modules.<KEY>.
