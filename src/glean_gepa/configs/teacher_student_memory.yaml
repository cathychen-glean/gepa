# Memory + personalization prompt (scio stripped_engram_memory_instructions), seeded from
# askscio/scio#299585, which adds a '## Personalization' section to the stock prompt.
#
# STATUS: example wiring, not yet run. Before a long run:
# - check one student trajectory's system prompt for '## Memory' and '## Personalization';
#   the prompt renders only for users with memory on (see prompts/stripped_engram_memory_instructions/target.yaml)
# - agentic_preference does not score personalization specifically; swap in a personalization
#   judge or eval set once one exists
#
# Every eval in this run, teacher included, gets the target's render scParams (stripped
# prompts on, memory on). The teacher keeps scio's own memory prompt and acts as the
# reference.

schema_version: 1
mode: teacher_student

run:
  dir: run_ts_memory
  max_metric_calls: 16
  eval_run_timeout_sec: 21600
  seed_candidate: data/memory_personalization_seed.prompt

models:
  student: gpt6_luna
  teacher: gpt6_1_sol_high
  reflection: CUSTOM:GPT5_6_LUNA

data:
  eval_set_name: Glean Chat V2 Medium
  val_eval_set_name: Glean Chat V2
  deployment_ids: [scio-prod]
  lookback_days: 14
  days_back: 0
  val_version_count: 1

signals:
  - name: agentic_preference_rate
    source: agentic_preference
    lookback_days: 7

objective:
  primary: agentic_preference_rate
  frontier_type: objective
  composite:
    agentic_preference_rate: 1.0
  focused_bucket_type: QUERY_CANONICAL
  validation:
    - metric: agentic_preference_rate
      min: 0.50

screening:
  kind: none

reflection:
  editable_modules: [PERSONALIZATION, MEMORY_APPLY, MEMORY_TRIGGERS]
  failure_label: "REFLECTION EXAMPLES (teacher-preferred LOSS and student-preferred KEEP)"
  report_title: "REFLECTION: teacher vs student agentic preference (memory prompt)"

search:
  offspring_count: 5
  reflection_samples: 25
  reflection_hamming_distance_k: null
  global_token_cap: 4096
