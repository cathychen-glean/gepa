    - "co.lo.icpo.waldo_handoff_chinese_japanese_text=false"

data:
  # TODO(gap-2): replace with the Waldo team's routing / tool query set once it is
  # registered in EvalCLI with per-entry labels (expected_route, expected_tool).
  eval_set_name: Glean Chat V2 Medium
  # Regression check stays on Glean Chat V2 regardless of the training set.
  val_eval_set_name: Glean Chat V2 Medium
  deployment_ids: [scio-prod]
  lookback_days: 14
  days_back: 0
  val_version_count: 1
  # Pinned so validation is scored on scio-prod, not a sampled customer deployment.
  # Train and val are disjoint; two train versions so a childless generation does not
  # exhaust the schedule.
  train_eval_versions: [20261001, 20260908]
  val_eval_versions: [20260909]

signals:
  - name: tool_alignment
    source: tool_match
    lookback_days: 7
  # judge_pairwise_agentic_correctness: pairwise, randomized_single_0_10, correctness
  # dimension only. Per-entry 0-4 = teacher more correct, 5 = tie, 6-10 = student more
  # correct; aggregate is the tie-split preference rate, so 0.50 = parity with the
  # teacher. Cortex type is AGENTIC_JUDGE; the adapter keys it separately so it does
  # not collide with the multi-dimension agentic judge.
  - name: agentic_correctness_rate
    source: cortex_judge
    type: AGENTIC_CORRECTNESS_JUDGE
    kind: pairwise

objective:
  primary: tool_alignment
  frontier_type: hybrid
  composite:
    tool_alignment: 1.0
  focused_bucket_type: QUERY_CANONICAL
  # Waldo's tool set is glean_search, glean_document_reader, employee_search,
  # web_search, and discover. Spans for the first four are `Execute Action: <Tool>`
  # and compare directly.
  #
  # `discover` is different. The harness runs skip_waldo_escalation_discovery=true,
  # so a discover call does NOT invoke the tool: Waldo terminates
  # (SAW_INSUFFICIENT_TOOLS) and hands off to the full agent with no Execute Action
  # span of its own. The first scored span on an escalated run is therefore the full
  # agent's first tool, not Waldo's. Teacher-escalates vs student-searches still
  # mismatches most of the time (full agent rarely leads with the same search), but
  # that is a side effect, not a direct escalation measure. Treat tool_alignment as
  # "same first tool" only.
  params:
    skipped_tools:
      - Personal Knowledge Vault Retrieve
      - Shell
      - Shell Tool
      - find_skills_assistant
    failure_score_below: 0.7
  validation:
    # Correctness floor: 4.8 on the judge's 0-10 pairwise scale (5 = parity with the
    # teacher), i.e. 0.48 as the normalized tie-split rate the gate reads.
    - metric: agentic_correctness_rate
      min: 0.48

screening:
  # Focused (high-signal) screen: child must fix >= 25% of the parent's first-tool
  # mismatches. No judge runs on the slice; correctness is gated at validation only.
  kind: high_signal_fix_rate
  threshold: 0.25
  high_signal: tool_alignment

reflection:
  editable_modules: [WALDO_TOOL_USAGE]
  failure_label: "HIGH-SIGNAL FAILURES (teacher vs student first tool)"
  report_title: "REFLECTION: Waldo tool choice — which attached tool, and when to hand off"
  modules:
    WALDO_TOOL_USAGE: >-
      This module is the "Tool Usage Guidelines" section of the Waldo router prompt.
      It decides when Waldo calls the discover tool (escalate to a stronger agent)
      versus using the attached search tools and answering directly. It has two
      conditional branches, <<<[[has_search_tools]] ... >>> and
      <<<[[no_search_tools]] ... >>>; scio renders exactly one per request. Keep
      both branches and every [[...]] placeholder. The failures below are cases
      where the teacher's first tool differed from the student's. State tool-choice
      rules in terms of request type (which attached tool fits which kind of
      lookup; when nothing fits, discover), never in terms of specific documents or
      customers from the examples.

search:
  offspring_count: 5
  reflection_samples: 25
  reflection_hamming_distance_k: null
  # WALDO_SYSTEM (~5.9k tok) + WALDO_TOOL_USAGE budget (2560). Must exceed their sum so
  # the per-module budget binds, not this cap.
  global_token_cap: 9216
