# Waldo escalation experiment (teacher-student).
#
# Goal: tune the Waldo routing core (WALDO_ROUTING: First-Action Decision through the
# Routing section) so the lightweight router escalates to the full agent on the same
# requests a stronger model would, without regressing agentic-judge correctness. Sibling
# of teacher_student_waldo.yaml, which scores first-tool match and tunes the Tool Usage
# Guidelines instead; harness and models are identical.
#
# Score (`escalation_match`): per entry where Waldo ran in both runs, 1 when teacher
# and student both end SAW_INSUFFICIENT_TOOLS or neither does. Fallback terminations
# (NO_SAMPLE, MAX_LOOPS_EXHAUSTED, NO_TOOL_CALLS) count as not escalating, so a
# prompt cannot score by timing out. Effective-handoff agreement ("anything but
# SAW_READY") is printed in the validation log only; it is not a score dimension, so it
# is neither weighted nor a frontier key.
#
# Base rate: in the 2026-10-01 reference pair (Luna teacher vs Qwen student) the teacher
# escalated on 88.5% of both-ran entries, so an always-escalate student would have scored
# ~0.885. If this teacher is similar, only the correctness floor below guards against
# over-escalation; watch the logged student escalation rate.
#
# Run:  uv run python -m glean_gepa.runner --config teacher_student_waldo_escalation

schema_version: 1
mode: teacher_student

run:
  dir: run_ts_waldo_escalation
  max_metric_calls: 10
  # Post-search seed-vs-best eval on the val set, gated by objective.validation. With
  # val pinned below it runs on scio-prod, not a sampled customer deployment.
  customer_eval: true
  eval_run_timeout_sec: 21600
  # Seed is the LIVE production Waldo prompt (from a Waldo eval's
  # llmo.per_prompt_overrides.waldo_system), split into WALDO_SYSTEM (template with
  # {WALDO_ROUTING} and {WALDO_TOOL_USAGE} slots), WALDO_ROUTING (everything before
  # "### Available Tools"), and WALDO_TOOL_USAGE (the "Glean Search Argument
  # Construction" rules + search-tool conditionals). It compiles to exactly the prompt
  # in data/waldo_seed_candidate.json. Only WALDO_ROUTING is edited: most of
  # WALDO_TOOL_USAGE builds search arguments and does not move the escalation decision.
  seed_candidate: data/waldo_routing_seed_candidate.json
  editable_modules: [WALDO_ROUTING]

models:
  # `waldo[:PROVIDER:MODEL[:effort]]` turns on the Waldo router
  # (co.lo.icpo.should_run_waldo_qe) and sets co.lo.icpo.waldo_model. Bare `waldo`
  # is scio's default BASETEN:WALDO. The sample Waldo eval ran OPEN_AI:GPT6_LUNA:none.
  # TODO(gap-1): confirm with the team which deployment they are tuning for.
  student: waldo:OPEN_AI:GPT6_LUNA:none
  teacher: waldo:OPEN_AI:GPT6_1_SOL:high
  reflection: CUSTOM:GPT5_6_LUNA

eval:
  # EvalCLI --runner-type. Waldo evals run on the standard Glean Chat runner.
  runner_type: GLEAN_CHAT
  # Base scParams for every eval run in this experiment (teacher and student).
  # Taken from a production Waldo eval on 2026-10-01. Replaces the alias's built-in
  # harness preset (WALDO_HARNESS_SC_PARAMS). The runner appends per run:
  #   co.lo.icpo.should_run_waldo_qe=true, co.lo.icpo.waldo_model=<from models.*>,
  #   llmo.per_prompt_overrides.waldo_system=<compiled candidate>.
  # Values are verbatim; nested params keep their %-encoding. Long entries are
  # single-line on purpose: YAML folding would corrupt the encoding.
  sc_params:
    - "co.internal_looping_pyagent_default_route_override=coding_agent_loop"
    - "co.lo.mo.slwo.disabled=1"
    - "ro.scholastic_required=true"
    - "db.disable_usr=true"
    - "db.filter_query_debug_results=true"
    - "db.filter_bad_query_jiras=true"
    - "db.include_final_scores=true"
    - "ro.ro.fetch_supplemental_results=false"
    - "db.ranking_only=true"
    - "db.debug_mode=1"
    - "co.debug_only_disabled_tools_list=gmail_search;outlook_search;respond;think;curl"
    - "db.get_doc_metadata=true"
    - "co.lo.enable_agent_recommendation=false"
    - "ro.feso.slso.drop_slack_native=false"
    - "ro.feso.slso.skip_inline_rts=true"
    - "co.disable_full_document_content=true"
    - "wo.plan_only_dry_run_for_write_actions=true"
    - "wo.plan_only_dry_run_for_write_actions_in_actas=true"
    - "co.lo.cao.agentic_loop_sc_params_exp=co.lo.cao.use_stripped_prompts%3D1%2Cco.lo.fast_mode_core_tools_only%3Dfalse%2Cco.so.ptc_only_tools%3Dglean_search%253Bglean_document_reader%253Bdiscover%253Bask_user_questions%2Cco.lo.cao.core_tools_set%3Dglean_search%253Bglean_document_reader%253Bdiscover%253Bask_user_questions%2Cco.lo.cao.bare_tool_configs%3DCode%2520Search%253Acode_search%2528query%252C%2520exhaustive%253F%252C%2520extension%253F%2529.%2520Search%2520company%2520code%252C%2520configs%252C%2520schemas%252C%2520commits%252C%2520and%2520snippets.%2520Primary%2520tool%2520for%2520any%2520technical%2520question%2520about%2520implementation%2520ground%2520truth%252C%2520system%2520behavior%252C%2520code%2520locations%252C%2520bugs%252C%2520errors%252C%2520config%2520keys%252C%2520APIs%252C%2520data%2520models%252C%2520feature%2520flags%252C%2520or%2520how%252Fwhere%252Fwhy%2520something%2520is%2520implemented.%2520Set%2520exhaustive%2520only%2520when%2520the%2520user%2520asks%2520for%2520all%2520or%2520every%2520match.%253BWeb%2520Search%253Aweb_search%2528query%252C%2520freshness%253F%2529.%2520Public%2520web%2520search.%2520Set%2520freshness%2520to%2520%2522pd%2522%252C%2520%2522pw%2522%252C%2520%2522pm%2522%252C%2520or%2520%2522YYYY-MM-DDtoYYYY-MM-DD%2522%2520only%2520when%2520the%2520query%2520asks%2520for%2520current%2520or%2520time-bounded%2520information.%253BEmployee%2520Search%253Aemployee_search%2528query%252C%2520startafter%253F%252C%2520startbefore%253F%252C%2520roletype%253F%252C%2520reportsto%253F%252C%2520exhaustive%253F%252C%2520sortby%253F%252C%2520peoplenamesoremails%253F%2529.%2520People%2520and%2520org%2520directory.%2520query%2520is%2520required.%2520Pass%2520%2522%252A%2522%2520when%2520you%2520only%2520want%2520filters%252C%2520e.g.%2520employee_search%2528%2522%252A%2522%252C%2520reportsto%253D%2522Jane%2520Doe%2522%2529%2520for%2520a%2520manager%2527s%2520direct%2520reports.%2520peoplenamesoremails%2520takes%2520up%2520to%252025%2520