# Waldo escalation experiment (teacher-student).
#
# Goal: tune the Waldo routing rules (the WALDO_ROUTING core plus the lines in WALDO_SYSTEM
# and WALDO_TOOL_USAGE that restate it) so the lightweight router escalates to the full
# agent on the same requests a stronger model would, without regressing agentic-judge
# correctness. Sibling
# of teacher_student_waldo.yaml, which scores first-tool match and tunes the Tool Usage
# Guidelines instead; harness and models are identical.
#
# Base rate: if the teacher escalates on most entries, an always-escalate student scores
# close to that rate, and only the correctness floor below guards against over-escalation.
# Watch the logged student escalation rate.
#
# Run:  uv run python -m glean_gepa.runner --config teacher_student_waldo_escalation

schema_version: 1
mode: teacher_student

run:
  dir: run_ts_waldo_escalation
  max_metric_calls: 10
  # Post-search seed-vs-best eval on the val set, gated by objective.validation. With
  # val pinned below it runs on scio-prod, not a sampled customer deployment.
  customer_eval: true
  eval_run_timeout_sec: 21600
  # No seed_candidate: the seed is scio master's waldo_system.prompt
  # (prompts/waldo_system/template.prompt), split into WALDO_SYSTEM (the template with
  # {WALDO_ROUTING} and {WALDO_TOOL_USAGE} slots), WALDO_ROUTING (Role & Capabilities and
  # Routing), and WALDO_TOOL_USAGE (the body under "### Tool Usage Guidelines").
  editable_modules: [WALDO_ROUTING, WALDO_SYSTEM, WALDO_TOOL_USAGE]

models:
  student: waldo:OPEN_AI:GPT6_LUNA:none
  teacher: waldo:OPEN_AI:GPT6_1_SOL:high
  reflection: CUSTOM:GPT5_6_LUNA

eval:
  # EvalCLI --runner-type. Waldo evals run on the standard Glean Chat runner.
  # Harness scParams are WALDO_HARNESS_SC_PARAMS; the runner appends the Waldo
  # enable flag, model, and compiled waldo_system override.
  runner_type: GLEAN_CHAT

data:
  eval_set_name: Glean Chat V2 Medium
  # Full Glean Chat V2 for validation: 1000 entries on scio-prod at 20260909, vs 200
  # for the Medium set used in training.
  val_eval_set_name: Glean Chat V2
  deployment_ids: [scio-prod]
  lookback_days: 14
  days_back: 0
  val_version_count: 1
  # Pinned so validation is scored on scio-prod, not a sampled customer deployment.
  # Train and val are disjoint; two train versions so a childless generation does not
  # exhaust the schedule.
  train_eval_versions: [20261001, 20260908]
  val_eval_versions: [20260909]

signals:
  - name: escalation_match
    source: escalation_match
    lookback_days: 7
  - name: agentic_correctness_rate
    source: cortex_judge
    type: AGENTIC_CORRECTNESS_JUDGE
    kind: pairwise

objective:
  primary: escalation_match
  frontier_type: hybrid
  composite:
    escalation_match: 1.0
  focused_bucket_type: QUERY_CANONICAL
  # Read from agentspan: the `Waldo` span's ic_preloop.termination, and the
  # `Agent Run: WaldoAgent` message for skips (`skipped:<reason>`), on each entry's latest trace.
  validation:
    - metric: agentic_correctness_rate
      min: 0.48

screening:
  # Focused (high-signal) screen: child must fix >= 25% of the parent's escalation
  # mismatches. A fix is the child's student flipping to the parent teacher's decision:
  # escalating where that teacher escalated, answering (SAW_READY) where it did not.
  kind: high_signal_fix_rate
  threshold: 0.25
  high_signal: escalation_match

reflection:
  editable_modules: [WALDO_ROUTING, WALDO_SYSTEM, WALDO_TOOL_USAGE]
  # No `modules:` override: the objective's per-module responsibilities carry the score
  # model, the analysis guide, and which lines of each module move escalation; a YAML
  # entry would replace one wholesale.

search:
  offspring_count: 5
  reflection_samples: 25
  reflection_hamming_distance_k: null
  global_token_cap: 10752
