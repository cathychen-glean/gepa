# Teacher-student experiment: first-tool alignment from paired traces.
#
# This file is self-contained. `signals`, `objective`, `screening`, and
# `reflection` below are the full experiment; nothing is merged in from elsewhere.
# `signals[].source` must be a telemetry source registered for this mode in
# glean_gepa/objectives/registry.py (teacher_student: tool_match, citation_match,
# agentic_preference).
#
# To optimize citation-set alignment instead, swap in the `citation_match` variant
# shown in comments at each section.

schema_version: 1
mode: teacher_student

run:
  dir: run_ts # or dir: run_ts_citations
  max_metric_calls: 10
  eval_run_timeout_sec: 21600
  seed_candidate: data/seed_candidate.json

models:
  student: claude_sonnet
  teacher: claude_opus
  # glean-dev QE is on customer key + LiteLLM custom provider since 2026-09-30; OPEN_AI:*
  # is not enabled there ("GPT5_LATEST not enabled in any provider"). GPT5_6_LUNA is
  # aliased to gpt-5.1 on that proxy. Use OPEN_AI:GPT5_LATEST only on a Glean-key instance.
  reflection: CUSTOM:GPT5_6_LUNA

data:
  eval_set_name: Glean Chat V2 Medium
  deployment_ids: [scio-prod]
  lookback_days: 14
  days_back: 0
  val_version_count: 2

signals:
  - name: tool_alignment
    source: tool_match
    lookback_days: 7
  # citations variant:
  # - name: citation_match
  #   source: citation_match
  #   lookback_days: 7
  - name: correctness
    source: cortex_judge
    type: CORRECTNESS
    kind: pairwise
    run_params:
      judge_type: DIRECT_CORRECTNESS
      llm_model: default
      use_cache: true

objective:
  # Parent selection reads the primary. The child gate is screening.weights.
  primary: tool_alignment # or citation_match
  frontier_type: hybrid
  composite:
    tool_alignment: 1.0 # or citation_match: 1.0
  focused_bucket_type: QUERY_CANONICAL
  params:
    # tool_match only; citations variant uses failure_score_below: 1.0 and no skipped_tools.
    skipped_tools:
      - Personal Knowledge Vault Retrieve
      - Shell
      - Shell Tool
      - find_skills_assistant
    failure_score_below: 0.7
  validation:
    - metric: correctness
      min: 0.80
    - metric: agentic_preference_rate
      min: 0.50

screening:
  kind: high_signal_fix_rate
  threshold: 0.25
  high_signal: tool_alignment # or citation_match
  # Focused child must clear threshold on this blend. The agentic judge is
  # started because it is named here, even though it is not the primary.
  weights:
    tool_alignment: 0.5 # or citation_match: 0.5
    agentic_preference_rate: 0.5

reflection:
  editable_modules: [CORE_TOOLS, RULES_EXT] # citations variant: [WRITING_CODE, RULES_EXT]
  failure_label: "HIGH-SIGNAL FAILURES (teacher vs student tool match)"
  report_title: "REFLECTION: teacher vs student tool sequences"
  # citations variant:
  # failure_label: "HIGH-SIGNAL FAILURES (teacher vs student citation match)"
  # report_title: "REFLECTION: teacher vs student citation sets"
  # Override module reflection prompts with modules.<KEY>.

search:
  offspring_count: 5
  # Set to `all` to reflect on every available example.
  reflection_samples: 8
  reflection_hamming_distance_k: null
  # Total prompt-token ceiling a mutated candidate may reach.
  global_token_cap: 4096
