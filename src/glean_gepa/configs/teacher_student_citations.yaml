# Teacher-student experiment: the student's citation set is scored against the
# teacher's on paired traces.

schema_version: 1
mode: teacher_student
packs: [citations]

run:
  dir: run_ts_citations
  max_metric_calls: 10
  eval_run_timeout_sec: 21600
  seed_candidate: data/seed_candidate.json
  editable_modules: [WRITING_CODE, RULES_EXT]

models:
  student: claude_sonnet
  teacher: claude_opus
  reflection: OPEN_AI:GPT5_LATEST

data:
  eval_set_name: Glean Chat V2 Medium
  deployment_ids: [scio-prod]
  lookback_days: 14
  days_back: 0
  val_version_count: 2

objective:
  frontier_type: hybrid
  validation: []

search:
  offspring_count: 5
  reflection_samples: 8
  reflection_hamming_distance_k: null
  global_token_cap: 4096
