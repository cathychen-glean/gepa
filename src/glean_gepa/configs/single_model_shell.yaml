# Single-model experiment: shell-tool success from Agentspan telemetry.
# Run with `--config single_model_shell`.
#
# This file is self-contained. `signals`, `objective`, `screening`, and
# `reflection` below are the full experiment; nothing is merged in from elsewhere.
# `signals[].source` must be a telemetry source registered for this mode in
# glean_gepa/objectives/registry.py.

schema_version: 1
mode: single_model

run:
  dir: run_sm
  max_metric_calls: 10
  eval_run_timeout_sec: 21600
  seed_candidate: data/seed_candidate.json

models:
  student: gpt
  reflection: CUSTOM:GPT5_6_LUNA

data:
  eval_set_name: Glean Chat V2 Medium
  deployment_ids: [scio-prod]
  lookback_days: 14
  days_back: 0
  val_version_count: 2

signals:
  - name: shell_success_rate
    source: shell_telemetry
    lookback_days: 1

objective:
  primary: shell_success_rate
  frontier_type: objective
  composite:
    shell_success_rate: 1.0
  focused_bucket_type: SESSION
  params:
    failure_score_below: 0.9
  validation:
    - metric: correctness
      min: 0.80
    - metric: agentic_preference_rate
      min: 0.50

screening:
  kind: high_signal_fix_rate
  threshold: 0.5
  high_signal: shell_success_rate

reflection:
  editable_modules: [WRITING_CODE, CORE_TOOLS]
  failure_label: HIGH-SIGNAL FAILURES
  # Override module reflection prompts with modules.<KEY>.

search:
  offspring_count: 5
  # Set to `all` to reflect on every available example.
  reflection_samples: 8
  reflection_hamming_distance_k: null
  # Total prompt-token ceiling a mutated candidate may reach. Raised at startup to
  # fit the per-module budgets, so a value below those cannot starve a module.
  global_token_cap: 4096
