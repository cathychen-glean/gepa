# Teacher-student experiment with pairwise agentic preference as the primary.
#
# The agentic pack supplies the scored signal, objective.primary, and the
# high-signal screen (AGENTIC_JUDGE on teacher-preferred rows). Signals below
# are merged with the pack's by name; objective/screening keys below override
# the pack's.


schema_version: 1
mode: teacher_student
packs: [agentic]

run:
  dir: run_ts_agentic
  max_metric_calls: 10
  eval_run_timeout_sec: 21600
  seed_candidate: data/seed_candidate.json

models:
  student: claude_sonnet
  teacher: claude_opus
  reflection: OPEN_AI:GPT5_LATEST

data:
  eval_set_name: Glean Chat V2 Medium
  deployment_ids: [scio-prod]
  lookback_days: 14
  days_back: 0
  val_version_count: 1
  val_eval_versions: [20260906]

objective:
  frontier_type: objective
  composite:
    agentic_preference_rate: 1.0
  validation:
    - metric: agentic_preference_rate
      min: 0.50

search:
  offspring_count: 5
  # Integer caps the random teacher-preferred sample; `all` sends every loss.
  reflection_samples: 25
  reflection_hamming_distance_k: null
  # Total prompt-token ceiling a mutated candidate may reach.
  global_token_cap: 4096
