# The memory instructions scio appends to the agent system prompt when memory is enabled
# (scio stripped_engram_memory_instructions.prompt, master 91e3254f046).
#
# Scio renders this template only when the agent runs stripped prompts (otherwise it uses
# engram_memory_instructions) and memory is on: that takes a container manager, company
# tools, and chat personalization for the user.
#
# PERSONALIZATION has no slot in stock text. data/memory_personalization_seed.prompt seeds
# it from askscio/scio#299585, which adds a '## Personalization' section.
harnesses: [coding]

# The Coding Harness preset turns memory off. Every eval in a run that edits this prompt,
# teacher included, turns it back on and switches to stripped prompts. Before a long run,
# check one trajectory's system prompt for '## Memory'.
render:
  sc_params:
    - co.lo.cao.use_stripped_prompts=1
    - co.lo.mo.slwo.enabled=1
  drop_sc_params:
    - co.lo.mo.slwo.disabled=1

template:
  key: MEMORY_INSTRUCTIONS
  token_budget: 512
  required_placeholders: [memory_dir, memory_context]
  frame: >-
    You are editing the frame of the memory instructions: the '## Memory' heading, the
    memory-folder line, the sentence that introduces the triggers, the
    <memory-context>[[memory_context]]</memory-context> block, and any section headings.
    The trigger list, apply rule, tool-failure rule, and personalization guidance are
    separate modules spliced in at their {SLOT} lines; keep every slot line.

sections:
  MEMORY_TRIGGERS:
    token_budget: 768
    frame: >-
      You are rewriting the bullet list of cues that make the assistant read and follow the
      memory skill for a new query. Each line must start with '- '. Do not add a heading.
  MEMORY_APPLY:
    token_budget: 384
    frame: >-
      You are rewriting the paragraph that tells the assistant to silently apply relevant
      `## User-Defined` memory entries, and how those entries rank against the current
      request and active instructions. Do not add a heading.
  MEMORY_TOOL_FIX:
    token_budget: 384
    frame: >-
      You are rewriting the paragraph on using knowledge-memory entries after a tool fails:
      which entries qualify, trying a `[fix]` once, and removing an entry whose fix fails.
      Do not add a heading.
  PERSONALIZATION:
    token_budget: 1024
    frame: >-
      You are rewriting the body of the '## Personalization' section: how the user's personal
      context (identity, projects, goals, role, preferences) should shape retrieval and the
      answer. The heading stays in the template; do not add one.
